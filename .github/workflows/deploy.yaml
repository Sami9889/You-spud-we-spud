# You Spud, We Spud — Deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 1: Deploy static site to GitHub Pages
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-static:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      wait-concurrency: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject APPS_SCRIPT_URL into HTML
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          sed -i "s|__APPS_SCRIPT_URL__|${APPS_SCRIPT_URL}|g" form/index.html

      - name: Inject Netlify function URL into HTML
        env:
          TOKEN_PROXY: ${{ vars.TOKEN_PROXY_URL }}
        run: |
          sed -i "s|__TOKEN_PROXY_URL__|${TOKEN_PROXY}|g" form/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 2: Deploy OAuth token proxy to Netlify Functions
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-token-proxy:
    name: Deploy Token Proxy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Set API_HC env var on Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify env:set API_HC "${{ secrets.API_HC }}" --site=${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy --prod \
            --dir=. \
            --site=${{ secrets.NETLIFY_SITE_ID }} \
            --message="Token proxy deployed via GitHub Actions"

# You Spud, We Spud — Deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject admin credentials and order token
        env:
          ADMIN_CREDENTIALS: ${{ secrets.ADMIN_CREDENTIALS }}
          ADMIN_ORDER_TOKEN: ${{ secrets.ADMIN_ORDER_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          creds = os.environ.get('ADMIN_CREDENTIALS')
          token = os.environ.get('ADMIN_ORDER_TOKEN')

          print(f'ADMIN_CREDENTIALS present: {creds is not None}')
          print(f'ADMIN_ORDER_TOKEN present: {token is not None}')

          if creds is None:
              print('::error::ADMIN_CREDENTIALS secret is missing')
              sys.exit(1)
          if token is None:
              print('::error::ADMIN_ORDER_TOKEN secret is missing')
              sys.exit(1)

          login_path = Path('functions/api/admin/login.js')
          if not login_path.exists():
              print(f'::error::Expected file not found: {login_path}')
              sys.exit(1)

          login_text = login_path.read_text()
          print(f'login.js placeholder count before: {login_text.count("__ADMIN_CREDENTIALS__")}')
          if '__ADMIN_CREDENTIALS__' not in login_text:
              print('::error::Placeholder __ADMIN_CREDENTIALS__ not found in login.js')
              sys.exit(1)

          login_path.write_text(login_text.replace('__ADMIN_CREDENTIALS__', creds))
          new_login = login_path.read_text()
          print(f'login.js placeholder count after: {new_login.count("__ADMIN_CREDENTIALS__")}')

          admin_path = Path('admin/index.html')
          if not admin_path.exists():
              print(f'::error::Expected file not found: {admin_path}')
              sys.exit(1)

          admin_text = admin_path.read_text()
          print(f'admin/index.html placeholder count before: {admin_text.count("__ADMIN_ORDER_TOKEN__")}')
          if '__ADMIN_ORDER_TOKEN__' not in admin_text:
              print('::error::Placeholder __ADMIN_ORDER_TOKEN__ not found in admin/index.html')
              sys.exit(1)

          admin_path.write_text(admin_text.replace('__ADMIN_ORDER_TOKEN__', token))
          new_admin = admin_path.read_text()
          print(f'admin/index.html placeholder count after: {new_admin.count("__ADMIN_ORDER_TOKEN__")}')

          if '__ADMIN_CREDENTIALS__' in new_login:
              print('::error::__ADMIN_CREDENTIALS__ still present after injection')
              sys.exit(1)
          if '__ADMIN_ORDER_TOKEN__' in new_admin:
              print('::error::__ADMIN_ORDER_TOKEN__ still present after injection')
              sys.exit(1)
          print('Verified no placeholders remain')
          PY

      - name: Provision KV namespace and bind to Pages
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          
          token = os.environ['CF_ACCOUNT_TOKEN']
          account_id = os.environ['CF_ACCOUNT_ID']
          project = 'youspudwespud'
          
          def cf(method, path, data=None):
              url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}{path}'
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read())
          
          list_resp = cf('GET', '/storage/kv/namespaces')
          kv_id = None
          for ns in list_resp.get('result', []):
              if ns.get('title') == 'ORDERS':
                  kv_id = ns['id']
                  break
          
          if not kv_id:
              create_resp = cf('POST', '/storage/kv/namespaces', {'title': 'ORDERS'})
              kv_id = create_resp.get('result', {}).get('id')
              if not kv_id:
                  raise SystemExit(f'Failed to create KV namespace: {create_resp}')
              print(f'Created KV namespace ORDERS with id {kv_id}')
          else:
              print(f'Found existing KV namespace ORDERS with id {kv_id}')
          
          project_resp = cf('GET', f'/pages/projects/{project}')
          project_data = project_resp.get('result', {})
          existing = [ns for ns in project_data.get('kv_namespaces', []) if ns.get('binding') != 'ORDERS']
          existing.append({'binding': 'ORDERS', 'id': kv_id})
          project_data['kv_namespaces'] = existing
          
          update_resp = cf('PUT', f'/pages/projects/{project}', project_data)
          if not update_resp.get('success'):
              print(f'Warning: Pages project update response: {update_resp}')
          else:
              print('Bound KV namespace ORDERS to Pages project')
          PY

      - name: Pack artifact
        run: |
          zip -r deploy.zip . -x "deploy.zip" ".git/*" ".devcontainer/*"

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          rm -rf .wrangler
          wrangler pages deploy . --project-name youspudwespud --commit-dirty=true

      - name: Attach custom domain to Pages project
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/youspudwespud/domains" \
            -H "Authorization: Bearer ${CF_ACCOUNT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"youspudwespud.sami-s.dev"}' || true

# You Spud, We Spud — Deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision KV namespace and bind to Pages
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          
          token = os.environ['CF_ACCOUNT_TOKEN']
          account_id = os.environ['CF_ACCOUNT_ID']
          project = 'youspudwespud'
          
          def cf(method, path, data=None):
              url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}{path}'
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read())
          
          list_resp = cf('GET', '/storage/kv/namespaces')
          kv_id = None
          for ns in list_resp.get('result', []):
              if ns.get('title') == 'ORDERS':
                  kv_id = ns['id']
                  break
          
          if not kv_id:
              create_resp = cf('POST', '/storage/kv/namespaces', {'title': 'ORDERS'})
              kv_id = create_resp.get('result', {}).get('id')
              if not kv_id:
                  raise SystemExit(f'Failed to create KV namespace: {create_resp}')
              print(f'Created KV namespace ORDERS with id {kv_id}')
          else:
              print(f'Found existing KV namespace ORDERS with id {kv_id}')
          
          project_resp = cf('GET', f'/pages/projects/{project}')
          project_data = project_resp.get('result', {})
          existing = [ns for ns in project_data.get('kv_namespaces', []) if ns.get('binding') != 'ORDERS']
          existing.append({'binding': 'ORDERS', 'id': kv_id})
          project_data['kv_namespaces'] = existing
          
          update_resp = cf('PUT', f'/pages/projects/{project}', project_data)
          if not update_resp.get('success'):
              print(f'Warning: Pages project update response: {update_resp}')
          else:
              print('Bound KV namespace ORDERS to Pages project')
          PY

      - name: Configure Pages Function environment variables
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_CREDENTIALS: ${{ secrets.ADMIN_CREDENTIALS }}
          ADMIN_ORDER_TOKEN: ${{ secrets.ADMIN_ORDER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ['CF_ACCOUNT_TOKEN']
          account_id = os.environ['CF_ACCOUNT_ID']
          project = 'youspudwespud'
          admin_credentials = os.environ.get('ADMIN_CREDENTIALS', '')
          admin_order_token = os.environ.get('ADMIN_ORDER_TOKEN', '')

          if not admin_credentials:
              print('::error::ADMIN_CREDENTIALS secret is missing')
              raise SystemExit(1)
          if not admin_order_token:
              print('::error::ADMIN_ORDER_TOKEN secret is missing')
              raise SystemExit(1)

          def cf(method, path, data=None):
              url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}{path}'
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  payload = json.loads(e.read())
                  raise SystemExit(f'Cloudflare API error {e.code}: {payload}')

          project_resp = cf('GET', f'/pages/projects/{project}')
          project_data = project_resp.get('result', {})

          existing_vars = project_data.get('vars', {})
          existing_vars['ADMIN_CREDENTIALS'] = admin_credentials
          existing_vars['ADMIN_ORDER_TOKEN'] = admin_order_token

          update_resp = cf('PATCH', f'/pages/projects/{project}', {'vars': existing_vars})
          if not update_resp.get('success'):
              print(f'Warning: Pages project update response: {update_resp}')
          else:
              print('Configured Pages Function environment variables')
          PY

      - name: Pack artifact
        run: |
          zip -r deploy.zip . -x "deploy.zip" ".git/*" ".devcontainer/*"

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          rm -rf .wrangler
          wrangler pages deploy . --project-name youspudwespud --commit-dirty=true

      - name: Attach custom domain to Pages project
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/youspudwespud/domains" \
            -H "Authorization: Bearer ${CF_ACCOUNT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"youspudwespud.sami-s.dev"}' || true

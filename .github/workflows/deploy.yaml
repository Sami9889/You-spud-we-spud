# You Spud, We Spud — Deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject admin credentials
        env:
          ADMIN_CREDENTIALS: ${{ secrets.ADMIN_CREDENTIALS }}
        run: |
          sed -i "s|__ADMIN_CREDENTIALS__|${ADMIN_CREDENTIALS}|g" functions/api/admin/login.js

      - name: Pack artifact
        run: |
          zip -r deploy.zip . -x "deploy.zip" ".git/*" ".devcontainer/*"

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler pages deploy . --project-name youspudwespud --commit-dirty=true

      - name: Attach custom domain to Pages project
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/youspudwespud/domains" \
            -H "Authorization: Bearer ${CF_ACCOUNT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"youspudwespud.sami-s.dev"}' || true

# You Spud, We Spud — Deploy
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages + Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Apps Script URL into HTML
        env:
          APP_SCRIPT_ID: ${{ secrets.APP_SCRIPT_ID }}
        run: |
          sed -i "s|__APPS_SCRIPT_URL__|https://script.google.com/macros/s/${APP_SCRIPT_ID}/exec|g" form/index.html

      - name: Pack artifact
        run: |
          zip -r deploy.zip . -x "deploy.zip" ".git/*" ".devcontainer/*"

      - name: Deploy token Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          API_HC: ${{ secrets.API_HC }}
        run: |
          npm install -g wrangler
          printf '%s' "$API_HC" | wrangler secret put API_HC --name youspudwespud-token
          wrangler deploy --name youspudwespud-token

      - name: Inject Worker URL into HTML
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          WORKER_URL="https://youspudwespud-token.${CF_ACCOUNT_ID}.workers.dev"
          sed -i "s|__TOKEN_PROXY_URL__|${WORKER_URL}|g" form/index.html

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages project create youspudwespud --production-branch main || true
          wrangler pages deploy . --project-name youspudwespud --commit-dirty=true

      - name: Attach custom domain to Pages project
        env:
          CF_ACCOUNT_TOKEN: ${{ secrets.CF_ACCOUNT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/youspudwespud/domains" \
            -H "Authorization: Bearer ${CF_ACCOUNT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"youspudwespud.sami-s.dev"}' || true

version: 1
tiers:
  - id: standard
    label: "Standard (<15KB)"
    max_size_kb: 15
  - id: hard
    label: "Hard Mode (<5KB)"
    max_size_kb: 5
  - id: ultra
    label: "Ultra Hard (<2KB)"
    max_size_kb: 2

required_fields:
  project_info:
    - project_name
    - project_url
    - source_url
    - file_size_kb
    - description
    - tier
  contact:
    - hc_name
    - hc_email
  shipping:
    - ship_name
    - phone
    - ship_line1
    - ship_line2
    - ship_city
    - ship_state
    - ship_country
    - ship_postal
  agreement:
    - accepted

shipping_rules:
  require_phone: true
  require_address_line1: true
  require_city: true
  require_country: true
  require_postal: true
  allow_po_box: false

url_rules:
  require_https: true
  github_repo_pattern: '^https://github\.com/[^/]+/[^/]+/?$'
  live_url_required: true

review:
  size_field: file_size_kb
  size_must_match_tier: true
  auto_accept_ultra: true
  require_manual_review: true

github_check:
  enabled: true
  default_branch: main
  github_token: ""
  include_extensions:
    - .js
    - .html
    - .css
    - .ts
    - .tsx
    - .jsx
    - .mjs
    - .cjs
    - .json
  exclude_extensions:
    - .md
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .ico
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .yaml
    - .yml
    - .toml
    - .lock
    - .map
    - .pdf
  declared_vs_actual_warn_ratio: 1.0
  declared_vs_actual_fail_ratio: 1.0
  require_https_urls: true
  strict_size_limit: true
  forbidden_files:
    - package.json
    - package-lock.json
    - yarn.lock
    - pnpm-lock.yaml
    - webpack.config.js
    - webpack.config.ts
    - vite.config.js
    - vite.config.ts
    - rollup.config.js
    - rollup.config.ts
    - parcel.config.js
    - gulpfile.js
    - Gruntfile.js
    - turbo.json
    - nx.json
    - lerna.json
    - .babelrc
    - babel.config.js
    - tsconfig.json
    - jsconfig.json
    - .eslintrc
    - .prettierrc
    - tailwind.config.js
    - tailwind.config.ts
  forbidden_dirs:
    - node_modules
    - dist
    - build
    - .next
    - .nuxt
    - .output
    - vendor
  forbidden_patterns:
    - "import React"
    - "from 'react'"
    - "from \"react\""
    - "import Vue"
    - "from 'vue'"
    - "from \"vue\""
    - "import Angular"
    - "from '@angular'"
    - "require('react')"
    - "require(\"react\")"
    - "require('vue')"
    - "require(\"vue\")"
    - "webpack"
    - "vite"
    - "rollup"
    - "parcel"
    - "browserify"
  obfuscation_rules:
    enabled: true
    warn_obfuscated: true
    fail_if_obfuscated: true
    suspicious_patterns:
      - "eval("
      - "Function("
      - "document.write("
      - "unescape("
      - "decodeURIComponent("
      - "String.fromCharCode("
      - "\\x"
      - "\\u"
      - "atob("
      - "btoa("
      - "ArrayBuffer"
      - "Uint8Array"
      - "DataView"
      - "pako"
      - "lz-string"
      - "lzma"
      - "Packer"
      - "Dean Edwards"
      - "eval(base64"
      - "document.write(atob"
      - "unescape(%u"
      - "while(1)"
      - "for(;;)"
    min_entropy_threshold: 4.5
    max_entropy_chunk_ratio: 0.6
